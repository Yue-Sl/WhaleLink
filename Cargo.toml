[workspace]
members = [
  "crates/whalelink-protocol",
  "crates/whalelink-core",
  "apps/whalelinkd",
  "apps/whalelink-server",
  "apps/whalelink-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/WhaleLink/whalelink"

[workspace.dependencies]
anyhow = "1.0.95"
axum = "0.7.9"
chrono = { version = "0.4.39", features = ["serde"] }
clap = { version = "4.5.27", features = ["derive"] }
rand = "0.8.5"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "process", "rt-multi-thread", "signal", "net", "io-util"] }
toml = "0.8.19"
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1.12.1", features = ["serde", "v4"] }
